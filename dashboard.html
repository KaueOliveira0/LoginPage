<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPanel - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #512da8; --bg: #f4f7fe; --shadow: 0 8px 30px rgba(0,0,0,0.05); --danger: #e74c3c; --success: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); display: flex; font-family: 'Montserrat', sans-serif; min-height: 100vh; }
        
        .sidebar { 
            width: 260px; 
            background: var(--primary); 
            color: white; 
            height: 100vh; 
            position: fixed; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        .sidebar h2 { font-weight: 700; margin-bottom: 30px; text-align: center; }
        .sidebar ul { list-style: none; flex-grow: 1; }
        .sidebar li { padding: 15px; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; }
        .sidebar li.active { background: rgba(255,255,255,0.2); }
        .sidebar li:hover { background: rgba(255,255,255,0.1); }
        .sidebar a { color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; font-weight: 600; }

        .btn-sair { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white; 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn-sair:hover { background: var(--danger); border-color: var(--danger); }

        .main { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-info { font-size: 18px; color: #333; background: white; padding: 10px 20px; border-radius: 50px; box-shadow: var(--shadow); }
        .user-info strong { color: var(--primary); }

        .month-picker { display: flex; align-items: center; gap: 20px; background: white; padding: 12px 25px; border-radius: 50px; box-shadow: var(--shadow); }
        .month-picker button { border: none; background: var(--primary); color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border-bottom: 4px solid var(--primary); }
        .card span { color: #888; font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; }
        .card h2 { margin: 0; font-size: 22px; color: #333; }

        .content-row { display: flex; gap: 30px; align-items: flex-start; }
        .chart-box { flex: 1; background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; }
        .vencimentos-box { flex: 1.2; background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); border-top: 5px solid var(--danger); min-height: 400px; }
        
        .item-vencido { background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .badge-data { background: var(--danger); color: white; padding: 3px 8px; border-radius: 50px; font-size: 11px; font-weight: bold; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>Painel Financeiro</h2>
        <ul>
            <li class="active"><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="financeiro.html"><i class="fa-solid fa-wallet"></i> Financeiro</a></li>
            <li><a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a></li>
        </ul>
        <button class="btn-sair" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
        </button>
    </nav>

    <main class="main">
        <div class="top-header">
            <div class="month-picker">
                <button onclick="mudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="mes-label">Carregando...</h3>
                <button onclick="mudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="user-info">
                <span>Olá, <strong id="user-name">Carregando...</strong></span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="card" style="border-color: var(--success);">
                <span><i class="fa-solid fa-money-bill-trend-up"></i> Renda Mensal</span>
                <h2 id="renda-display">R$ 0,00</h2>
            </div>
            <div class="card" style="border-color: var(--danger);">
                <span><i class="fa-solid fa-receipt"></i> Total do Mês</span>
                <h2 id="total-mes">R$ 0,00</h2>
            </div>
            <div class="card" style="border-color: #f39c12;">
                <span><i class="fa-solid fa-clock"></i> Pendente</span>
                <h2 id="total-pendente" style="color: #f39c12;">R$ 0,00</h2>
            </div>
            <div class="card" style="border-color: #3498db;">
                <span><i class="fa-solid fa-calendar-check"></i> Saldo Livre</span>
                <h2 id="saldo-livre" style="color: #3498db;">R$ 0,00</h2>
            </div>
        </div>

        <div class="content-row">
            <div class="chart-box">
                <h3>Gastos por Categoria (%)</h3>
                <canvas id="meuGrafico"></canvas>
            </div>
            <div class="vencimentos-box">
                <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> Vencimentos Atrasados</h3>
                <div id="lista-vencidos"></div>
            </div>
        </div>
    </main>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        // 1. Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBiHEK1MMew-1OXVpb1iUsnx249wPD6GYA",
            authDomain: "pagefinanceirokaue.firebaseapp.com",
            projectId: "pagefinanceirokaue",
            storageBucket: "pagefinanceirokaue.firebasestorage.app",
            messagingSenderId: "265354403807",
            appId: "1:265354403807:web:2953fdf433e32ee3676e6a"
        };

        // 2. Inicialização
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let dataFiltro = new Date(); 
        let meuChart = null;

        // 3. Monitoramento do Usuário
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Busca o nome real no Firestore
                db.collection("usuarios").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        document.getElementById('user-name').innerText = doc.data().nome;
                    }
                });
                atualizarDashboard();
            } else {
                window.location.href = "index.html";
            }
        });

        // 4. Função Principal do Dashboard
        function atualizarDashboard() {
            const user = auth.currentUser;
            if(!user) return;

            const m = dataFiltro.getMonth();
            const a = dataFiltro.getFullYear();
            const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
            document.getElementById('mes-label').innerText = `${nomesMeses[m]} ${a}`;

            // Busca os gastos no Firestore filtrando pelo usuário logado
            db.collection("gastos")
              .where("uid", "==", user.uid)
              .where("mes", "==", m)
              .where("ano", "==", a)
              .get().then((snapshot) => {
                let total = 0;
                let pendente = 0;
                let gastosData = [];

                snapshot.forEach(doc => {
                    const g = doc.data();
                    total += g.valor;
                    if(!g.pago) pendente += g.valor;
                    gastosData.push(g);
                });

                document.getElementById('total-mes').innerText = `R$ ${total.toFixed(2)}`;
                document.getElementById('total-pendente').innerText = `R$ ${pendente.toFixed(2)}`;
                
                // Busca a renda (você pode ajustar conforme seu sistema de configuração)
                document.getElementById('renda-display').innerText = `R$ 0,00`; // Ajustar conforme Firestore
                document.getElementById('saldo-livre').innerText = `R$ ${(0 - total).toFixed(2)}`;

                renderizarGrafico(gastosData);
                renderizarVencidos(user.uid);
            });
        }

        function renderizarGrafico(gastos) {
            const cats = { eletro:0, comida:0, lazer:0, fixo:0, outros:0 };
            gastos.forEach(g => { if(cats[g.categoria] !== undefined) cats[g.categoria] += g.valor; });

            const ctx = document.getElementById('meuGrafico').getContext('2d');
            if(meuChart) meuChart.destroy();
            meuChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Eletro', 'Comida', 'Lazer', 'Fixo', 'Outros'],
                    datasets: [{ data: Object.values(cats), backgroundColor: ['#ff9f43', '#ee5253', '#10ac84', '#54a0ff', '#8395a7'], borderWidth: 0 }]
                },
                options: { plugins: { legend: { position: 'bottom' } }, cutout: '75%' }
            });
        }

        function renderizarVencidos(uid) {
            const hoje = new Date();
            db.collection("gastos")
              .where("uid", "==", uid)
              .where("pago", "==", false)
              .get().then(snapshot => {
                  const lista = document.getElementById('lista-vencidos');
                  let html = "";
                  snapshot.forEach(doc => {
                      const g = doc.data();
                      // Lógica simples de vencimento (ajustar conforme sua data no Firestore)
                      html += `
                        <div class="item-vencido">
                            <div><strong>${g.descricao}</strong></div>
                            <div style="color:var(--danger); font-weight:bold;">R$ ${g.valor.toFixed(2)}</div>
                        </div>`;
                  });
                  lista.innerHTML = html || `<p style="text-align:center; color:var(--success);">Tudo em dia!</p>`;
              });
        }

        function mudarMes(direcao) {
            dataFiltro.setMonth(dataFiltro.getMonth() + direcao);
            atualizarDashboard();
        }

        // FUNÇÃO DE SAIR (CORRIGIDA)
        function logout() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.error("Erro ao sair:", error);
            });
        }
    </script>
</body>
</html>
