<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPanel - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #512da8; --bg: #f4f7fe; --shadow: 0 8px 30px rgba(0,0,0,0.05); --danger: #e74c3c; --success: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { background: var(--bg); display: flex; font-family: 'Montserrat', sans-serif; min-height: 100vh; }
        /* BARRA LATERAL AJUSTADA */
        .sidebar { 
            width: 260px; 
            background: var(--primary); 
            color: white; 
            height: 100vh; 
            position: fixed; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; /* Alinha os itens em coluna */
            justify-content: space-between; /* Empurra o botão de sair para o final */
        }

        .sidebar h2 { font-weight: 700; margin-bottom: 30px; text-align: center; }

        .sidebar ul { list-style: none; flex-grow: 1; } /* Faz a lista crescer e ocupar o meio */

        .sidebar li { padding: 15px; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; }
        .sidebar li.active { background: rgba(255,255,255,0.2); }
        .sidebar li:hover { background: rgba(255,255,255,0.1); }

        .sidebar a { color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; font-weight: 600; }

        /* BOTÃO DE SAIR CORRIGIDO */
        .btn-sair { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white; 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            transition: 0.3s;
            margin-bottom: 10px; /* Pequeno respiro do fundo da tela */
        }

        .btn-sair:hover { background: var(--danger); border-color: var(--danger); }

        .main { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        /* Ajuste do Cabeçalho */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-info { font-size: 18px; color: #333; background: white; padding: 10px 20px; border-radius: 50px; box-shadow: var(--shadow); }
        .user-info strong { color: var(--primary); }

        .month-picker { display: flex; align-items: center; gap: 20px; background: white; padding: 12px 25px; border-radius: 50px; box-shadow: var(--shadow); }
        .month-picker button { border: none; background: var(--primary); color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .stats-grid { 
                display: grid; 
                /* Isso força 4 colunas iguais na mesma linha */
                grid-template-columns: repeat(4, 1fr); 
                gap: 20px; 
                margin-bottom: 30px; 
            }

            /* Ajuste opcional: se os cards ficarem muito apertados em telas menores */
            @media (max-width: 1100px) {
                .stats-grid {
                    grid-template-columns: repeat(2, 1fr); /* Vira 2x2 em telas médias */
                }
            }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border-bottom: 4px solid var(--primary); }
        .card span { color: #888; font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; }
        .card h2 { margin: 0; font-size: 22px; color: #333; }
        .input-renda { border: 1px dashed var(--primary); background: #f9f9f9; padding: 5px; border-radius: 5px; width: 100px; color: var(--success); font-weight: bold; outline: none; font-family: 'Montserrat'; }

        .content-row { display: flex; gap: 30px; align-items: flex-start; }
        .chart-box { flex: 1; background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; }
        .vencimentos-box { flex: 1.2; background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); border-top: 5px solid var(--danger); min-height: 400px; }
        
        .item-vencido { background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .badge-data { background: var(--danger); color: white; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }

        canvas { max-height: 300px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>DevPanel</h2>
        <ul>
            <li class="active"><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="financeiro.html"><i class="fa-solid fa-wallet"></i> Financeiro</a></li>
            <li><a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a></li>
        </ul>
        <button class="btn-sair" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
        </button>
    </nav>

    <main class="main">
        <div class="top-header">
            <div class="month-picker">
                <button onclick="mudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="mes-label">Abril 2026</h3>
                <button onclick="mudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="user-info">
                <span>Olá, <strong id="user-name">Usuário</strong></span>
            </div>
        </div>

        <div class="stats-grid">
    <div class="card" style="border-color: var(--success);">
        <span><i class="fa-solid fa-money-bill-trend-up"></i> Renda Mensal</span>
        <h2 id="renda-display">R$ 0,00</h2>
    </div>

    <div class="card" style="border-color: var(--danger);">
        <span><i class="fa-solid fa-receipt"></i> Total do Mês</span>
        <h2 id="total-mes">R$ 0,00</h2>
    </div>

    <div class="card" style="border-color: #f39c12;">
        <span><i class="fa-solid fa-clock"></i> Pendente</span>
        <h2 id="total-pendente" style="color: #f39c12;">R$ 0,00</h2>
    </div>

    <div class="card" style="border-color: #3498db;">
        <span><i class="fa-solid fa-calendar-check"></i> Saldo Livre</span>
        <h2 id="saldo-livre" style="color: #3498db;">R$ 0,00</h2>
    </div>
</div>

        <div class="content-row">
            <div class="chart-box">
                <h3>Gastos por Categoria (%)</h3>
                <canvas id="meuGrafico"></canvas>
            </div>
            <div class="vencimentos-box">
                <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> Vencimentos Atrasados</h3>
                <div id="lista-vencidos"></div>
            </div>
        </div>
    </main>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyBiHEK1MMew-1OXVpb1iUsnx249wPD6GYA",
    authDomain: "pagefinanceirokaue.firebaseapp.com",
    projectId: "pagefinanceirokaue",
    storageBucket: "pagefinanceirokaue.firebasestorage.app",
    messagingSenderId: "265354403807",
    appId: "1:265354403807:web:2953fdf433e32ee3676e6a",
    measurementId: "G-BFQSFB93FR"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
    </script>

    <script>
        let dataFiltro = new Date(); 
        let meuChart = null;

        function logout() {
            localStorage.removeItem('lastLoggedIn');
            location.href='index.html';
        }

        function atualizarDashboard() {
    const emailLogado = localStorage.getItem('lastLoggedIn');
    if(!emailLogado) return location.href='index.html';

    const user = JSON.parse(localStorage.getItem(emailLogado));
    if(user) document.getElementById('user-name').innerText = user.name;

    const m = dataFiltro.getMonth(), a = dataFiltro.getFullYear();
    const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    document.getElementById('mes-label').innerText = `${nomesMeses[m]} ${a}`;

    // BUSCA A RENDA ESPECÍFICA DO MÊS SALVA NAS CONFIGURAÇÕES
    const keyRenda = `renda_${emailLogado}_${m}-${a}`;
    const rendaSalva = parseFloat(localStorage.getItem(keyRenda)) || 0; // 5000 é o padrão se estiver vazio

    document.getElementById('renda-display').innerText = `R$ ${rendaSalva.toFixed(2)}`;
    
    const banco = JSON.parse(localStorage.getItem(`financas_${emailLogado}`)) || [];
    const gastosMes = banco.filter(g => {
        const d = new Date(g.dataVenc + 'T00:00:00');
        return d.getMonth() === m && d.getFullYear() === a;
    });

    const totalMes = gastosMes.reduce((acc, g) => acc + g.valor, 0);
    const pendenteNoMes = gastosMes.filter(g => !g.pago).reduce((acc, g) => acc + g.valor, 0);

    document.getElementById('total-mes').innerText = `R$ ${totalMes.toFixed(2)}`;
    document.getElementById('total-pendente').innerText = `R$ ${pendenteNoMes.toFixed(2)}`;
    document.getElementById('saldo-livre').innerText = `R$ ${(rendaSalva - totalMes).toFixed(2)}`;

    // Lógica de Vencidos (Mantenha o resto do seu código original aqui...)
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const atrasados = banco.filter(g => !g.pago && new Date(g.dataVenc + 'T00:00:00') < hoje);

    const listaVencidos = document.getElementById('lista-vencidos');
    listaVencidos.innerHTML = atrasados.length === 0 ? 
        `<p style="color:var(--success); text-align:center; margin-top:50px;">Tudo em dia!</p>` :
        atrasados.map(g => `
            <div class="item-vencido">
                <div><strong>${g.info}</strong><br><small>Vencimento: <span class="badge-data">${g.dataVenc.split('-').reverse().join('/')}</span></small></div>
                <div style="color:var(--danger); font-weight:bold;">R$ ${g.valor.toFixed(2)}</div>
            </div>`).join('');

    const cats = { eletro:0, comida:0, lazer:0, fixo:0, outros:0 };
    gastosMes.forEach(g => { if(cats[g.cat] !== undefined) cats[g.cat] += g.valor; });

    const ctx = document.getElementById('meuGrafico').getContext('2d');
    if(meuChart) meuChart.destroy();
    meuChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Eletro', 'Comida', 'Lazer', 'Fixo', 'Outros'],
            datasets: [{ data: Object.values(cats), backgroundColor: ['#ff9f43', '#ee5253', '#10ac84', '#54a0ff', '#8395a7'], borderWidth: 0 }]
        },
        options: { plugins: { legend: { position: 'bottom' } }, cutout: '75%' }
    });
}

        function mudarMes(direcao) {
            dataFiltro.setMonth(dataFiltro.getMonth() + direcao);
            atualizarDashboard();
        }

        atualizarDashboard();
    </script>
</body>
</html>
