<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>DevPanel - Financeiro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="financeiro.css?v=15">
</head>
<body>
    <nav class="sidebar">
        <div>
            <h2>Painel Financeiro</h2>
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a></li>
                <li class="active"><a href="financeiro.html"><i class="fa-solid fa-wallet"></i> <span>Financeiro</span></a></li>
                <li><a href="configuracoes.html"><i class="fa-solid fa-gear"></i> <span>Configurações</span></a></li>
            </ul>
        </div>
        <button class="btn-sair" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> <span>Sair da Conta</span>
        </button>
    </nav>

    <main class="main">
        <div class="month-picker">
            <button onclick="mudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 id="mes-label">Carregando...</h3>
            <button onclick="mudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="form-box">
            <input type="text" id="desc" placeholder="Ex: Internet" style="flex: 2; min-width: 200px;">
            <select id="cat">
                <option value="fixo">🏠 Fixo</option>
                <option value="comida">🍔 Comida</option>
                <option value="eletro">🔌 Eletro</option>
                <option value="lazer">🍦 Lazer</option>
                <option value="outros">📦 Outros</option>
            </select>
            <input type="number" id="valor" placeholder="Valor Total" style="width: 120px;">
            <input type="number" id="parc" placeholder="Parc (1-12)" style="width: 80px;">
            <input type="date" id="venc">
            <button class="btn-salvar" id="btnRegistrar" onclick="salvar()">Registrar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Vencimento</th>
                    <th>Item / Parcela</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBiHEK1MMew-1OXVpb1iUsnx249wPD6GYA",
            authDomain: "pagefinanceirokaue.firebaseapp.com",
            projectId: "pagefinanceirokaue",
            storageBucket: "pagefinanceirokaue.firebasestorage.app",
            messagingSenderId: "265354403807",
            appId: "1:265354403807:web:2953fdf433e32ee3676e6a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let dataFiltro = new Date();
        const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

        auth.onAuthStateChanged((user) => {
            if (user) {
                listar(); 
            } else {
                window.location.href = "index.html";
            }
        });

        async function salvar() {
            const user = auth.currentUser;
            if (!user) return;

            const desc = document.getElementById('desc').value;
            const cat = document.getElementById('cat').value;
            const valorTotal = parseFloat(document.getElementById('valor').value);
            const parc = parseInt(document.getElementById('parc').value) || 1;
            const vencInput = document.getElementById('venc').value;

            if(!desc || !valorTotal || !vencInput) return alert("Preencha todos os campos!");

            const btn = document.getElementById('btnRegistrar');
            btn.disabled = true;
            btn.innerText = "Salvando...";

            const gastosRef = db.collection("usuarios").doc(user.uid).collection("gastos");

            for(let i=0; i<parc; i++) {
                let d = new Date(vencInput + 'T00:00:00');
                d.setMonth(d.getMonth() + i);

                await gastosRef.add({
                    info: parc > 1 ? `${desc} (${i+1}/${parc})` : desc,
                    cat: cat,
                    valor: valorTotal / parc,
                    dataVenc: d.toISOString().split('T')[0],
                    mes: d.getMonth(),
                    ano: d.getFullYear(),
                    pago: false,
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            document.getElementById('desc').value = "";
            document.getElementById('valor').value = "";
            btn.disabled = false;
            btn.innerText = "Registrar";
            listar();
        }

        async function listar() {
            const user = auth.currentUser;
            if (!user) return;

            const m = dataFiltro.getMonth();
            const a = dataFiltro.getFullYear();
            document.getElementById('mes-label').innerText = `${nomesMeses[m]} ${a}`;

            const hojeISO = new Date().toISOString().split('T')[0];
            const gastosRef = db.collection("usuarios").doc(user.uid).collection("gastos");

            try {
                const snapMes = await gastosRef.where("mes", "==", m).where("ano", "==", a).get();
                const snapAtrasadas = await gastosRef.where("pago", "==", false).where("dataVenc", "<", hojeISO).get();

                const corpo = document.getElementById('tabela-corpo');
                corpo.innerHTML = '';
                const todosGastos = new Map();

                snapAtrasadas.forEach(doc => todosGastos.set(doc.id, { id: doc.id, ...doc.data() }));
                snapMes.forEach(doc => { if (!todosGastos.has(doc.id)) todosGastos.set(doc.id, { id: doc.id, ...doc.data() }); });

                const listaFinal = Array.from(todosGastos.values()).sort((a, b) => a.dataVenc.localeCompare(b.dataVenc));

                if (listaFinal.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">Nenhum registro encontrado.</td></tr>';
                    return;
                }

                listaFinal.forEach((g) => {
                    const ehAtrasado = g.pago === false && g.dataVenc < hojeISO;
                    corpo.innerHTML += `
                        <tr class="${g.pago ? 'riscado' : ''}" style="${ehAtrasado ? 'background: #fff0f0;' : ''}">
                            <td data-label="Status">
                                <button onclick="alternarPago('${g.id}', ${g.pago})" class="btn-pago ${g.pago ? 'pago-true' : 'pago-false'}">
                                    ${g.pago ? '✅ Pago' : (ehAtrasado ? '⚠️ ATRASADO' : '⏳ Pagar')}
                                </button>
                            </td>
                            <td data-label="Vencimento" style="${ehAtrasado ? 'color: red; font-weight: bold;' : ''}">
                                ${g.dataVenc.split('-').reverse().join('/')}
                            </td>
                            <td data-label="Item">${g.info}</td>
                            <td data-label="Categoria">${g.cat}</td>
                            <td data-label="Valor">R$ ${Number(g.valor).toFixed(2)}</td>
                            <td data-label="Ação">
                                <button onclick="apagar('${g.id}')" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size: 1.2rem;">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao listar:", error);
            }
        }

        function alternarPago(id, statusAtual) {
            const user = auth.currentUser;
            db.collection("usuarios").doc(user.uid).collection("gastos").doc(id).update({ 
                pago: !statusAtual 
            }).then(() => listar());
        }

        function apagar(id) {
            if(confirm("Excluir este registro?")) {
                const user = auth.currentUser;
                db.collection("usuarios").doc(user.uid).collection("gastos").doc(id).delete().then(() => listar());
            }
        }

        function mudarMes(direcao) {
            dataFiltro.setMonth(dataFiltro.getMonth() + direcao);
            listar();
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = "index.html"; });
        }
    </script>
</body>
</html>
