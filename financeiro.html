<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPanel - Financeiro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #512da8; --bg: #f4f7fe; --shadow: 0 8px 30px rgba(0,0,0,0.05); --danger: #e74c3c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); display: flex; font-family: 'Montserrat', sans-serif; min-height: 100vh; }
        
        .sidebar { width: 260px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar h2 { font-weight: 700; margin-bottom: 30px; text-align: center; }
        .sidebar ul { list-style: none; flex-grow: 1; }
        .sidebar li { padding: 15px; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; }
        .sidebar li.active { background: rgba(255,255,255,0.2); }
        .sidebar li:hover { background: rgba(255,255,255,0.1); }
        .sidebar a { color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; font-weight: 600; }

        .btn-sair { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; margin-bottom: 10px; }
        .btn-sair:hover { background: var(--danger); border-color: var(--danger); }

        .main { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .month-picker { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; background: white; padding: 12px 25px; border-radius: 50px; width: fit-content; box-shadow: var(--shadow); }
        .month-picker button { border: none; background: var(--primary); color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }

        .form-box { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        input, select, .btn-salvar { padding: 12px 15px; border-radius: 10px; border: 1px solid #ddd; outline: none; font-family: 'Montserrat'; }
        .btn-salvar { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; padding: 12px 25px; }

        table { width: 100%; background: white; border-radius: 20px; border-collapse: collapse; overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 18px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; color: #666; font-size: 14px; }
        
        .btn-pago { border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .pago-true { background: #2ecc71; color: white; }
        .pago-false { background: #f1f3f5; color: #666; }
        .riscado { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>Painel Financeiro</h2>
        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li class="active"><a href="financeiro.html"><i class="fa-solid fa-wallet"></i> Financeiro</a></li>
            <li><a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a></li>
        </ul>
        <button class="btn-sair" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
        </button>
    </nav>

    <main class="main">
        <div class="month-picker">
            <button onclick="mudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <h3 id="mes-label">Carregando...</h3>
            <button onclick="mudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="form-box">
            <input type="text" id="desc" placeholder="Ex: Internet" style="flex: 2;">
            <select id="cat">
                <option value="fixo">🏠 Fixo</option>
                <option value="comida">🍔 Comida</option>
                <option value="eletro">🔌 Eletro</option>
                <option value="lazer">🍦 Lazer</option>
                <option value="outros">📦 Outros</option>
            </select>
            <input type="number" id="valor" placeholder="Valor Total" style="width: 120px;">
            <input type="number" id="parc" placeholder="Parc (1-12)" style="width: 80px;">
            <input type="date" id="venc">
            <button class="btn-salvar" id="btnRegistrar" onclick="salvar()">Registrar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Vencimento</th>
                    <th>Item / Parcela</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBiHEK1MMew-1OXVpb1iUsnx249wPD6GYA",
            authDomain: "pagefinanceirokaue.firebaseapp.com",
            projectId: "pagefinanceirokaue",
            storageBucket: "pagefinanceirokaue.firebasestorage.app",
            messagingSenderId: "265354403807",
            appId: "1:265354403807:web:2953fdf433e32ee3676e6a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let dataFiltro = new Date();
        const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

        // Observador de Autenticação
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("Usuário autenticado:", user.email);
                listar(); 
                
                db.collection("usuarios").doc(user.uid).get().then((doc) => {
                    const nomeExibicao = doc.exists ? doc.data().nome : "Usuário";
                    const campoNome = document.getElementById('user-name');
                    if (campoNome) campoNome.innerText = nomeExibicao;
                });
            } else {
                window.location.href = "index.html";
            }
        });

        async function salvar() {
            const user = auth.currentUser;
            if (!user) return;

            const desc = document.getElementById('desc').value;
            const cat = document.getElementById('cat').value;
            const valorTotal = parseFloat(document.getElementById('valor').value);
            const parc = parseInt(document.getElementById('parc').value) || 1;
            const vencInput = document.getElementById('venc').value;

            if(!desc || !valorTotal || !vencInput) return alert("Preencha todos os campos!");

            const btn = document.getElementById('btnRegistrar');
            btn.disabled = true;
            btn.innerText = "Salvando...";

            // REFERÊNCIA PARA A SUBCOLEÇÃO: usuarios > ID > gastos
            const gastosRef = db.collection("usuarios").doc(user.uid).collection("gastos");

            for(let i=0; i<parc; i++) {
                let d = new Date(vencInput + 'T00:00:00');
                d.setMonth(d.getMonth() + i);

                await gastosRef.add({
                    info: parc > 1 ? `${desc} (${i+1}/${parc})` : desc,
                    cat: cat,
                    valor: valorTotal / parc,
                    dataVenc: d.toISOString().split('T')[0],
                    mes: d.getMonth(),
                    ano: d.getFullYear(),
                    pago: false,
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            document.getElementById('desc').value = "";
            document.getElementById('valor').value = "";
            btn.disabled = false;
            btn.innerText = "Registrar";
            listar();
        }

        async function listar() {
            const user = auth.currentUser;
            if (!user) return;

            const m = dataFiltro.getMonth();
            const a = dataFiltro.getFullYear();
            document.getElementById('mes-label').innerText = `${nomesMeses[m]} ${a}`;

            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const hojeISO = hoje.toISOString().split('T')[0];

            // REFERÊNCIA PARA A SUBCOLEÇÃO DO USUÁRIO
            const gastosRef = db.collection("usuarios").doc(user.uid).collection("gastos");

            try {
                // Busca 1: Mes selecionado
                const snapMes = await gastosRef
                    .where("mes", "==", m)
                    .where("ano", "==", a)
                    .get();

                // Busca 2: Atrasados
                const snapAtrasadas = await gastosRef
                    .where("pago", "==", false)
                    .where("dataVenc", "<", hojeISO)
                    .get();

                const corpo = document.getElementById('tabela-corpo');
                corpo.innerHTML = '';
                const todosGastos = new Map();

                snapAtrasadas.forEach(doc => {
                    todosGastos.set(doc.id, { id: doc.id, ...doc.data() });
                });

                snapMes.forEach(doc => {
                    if (!todosGastos.has(doc.id)) {
                        todosGastos.set(doc.id, { id: doc.id, ...doc.data() });
                    }
                });

                const listaFinal = Array.from(todosGastos.values()).sort((a, b) => a.dataVenc.localeCompare(b.dataVenc));

                if (listaFinal.length === 0) {
                    corpo.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum registro encontrado.</td></tr>';
                    return;
                }

                listaFinal.forEach((g) => {
                    const ehAtrasado = g.pago === false && g.dataVenc < hojeISO;
                    corpo.innerHTML += `
                        <tr class="${g.pago ? 'riscado' : ''}" style="${ehAtrasado ? 'background: #fff0f0;' : ''}">
                            <td>
                                <button onclick="alternarPago('${g.id}', ${g.pago})" class="btn-pago ${g.pago ? 'pago-true' : 'pago-false'}">
                                    ${g.pago ? '✅ Pago' : (ehAtrasado ? '⚠️ ATRASADO' : '⏳ Pagar')}
                                </button>
                            </td>
                            <td style="${ehAtrasado ? 'color: red; font-weight: bold;' : ''}">
                                ${g.dataVenc.split('-').reverse().join('/')}
                            </td>
                            <td>${g.info}</td>
                            <td>${g.cat}</td>
                            <td>R$ ${Number(g.valor).toFixed(2)}</td>
                            <td>
                                <button onclick="apagar('${g.id}')" style="background:none; border:none; color:#e74c3c; cursor:pointer;">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao listar:", error);
                if(error.message.includes("index")) {
                    alert("Aguarde a criação do índice no Firebase...");
                }
            }
        }

        function alternarPago(id, statusAtual) {
            const user = auth.currentUser;
            db.collection("usuarios").doc(user.uid).collection("gastos").doc(id).update({ 
                pago: !statusAtual 
            }).then(() => listar());
        }

        function apagar(id) {
            const user = auth.currentUser;
            if(confirm("Excluir este registro?")) {
                db.collection("usuarios").doc(user.uid).collection("gastos").doc(id).delete().then(() => listar());
            }
        }

        function mudarMes(direcao) {
            dataFiltro.setMonth(dataFiltro.getMonth() + direcao);
            listar();
        }

        function logout() {
            auth.signOut().then(() => { window.location.href = "index.html"; });
        }
    </script>
</body>
</html>
