<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DevPanel - Configurações</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #512da8; --bg: #f4f7fe; --shadow: 0 8px 30px rgba(0,0,0,0.05); }
        body { background: var(--bg); display: flex; font-family: 'Montserrat', sans-serif; min-height: 100vh; margin: 0; }
        .sidebar { width: 260px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 25px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-bottom: 30px; text-align: center; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { padding: 15px; border-radius: 12px; margin-bottom: 8px; }
        .sidebar li.active { background: rgba(255,255,255,0.2); }
        .sidebar a { color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .main { margin-left: 260px; padding: 40px; width: 100%; }
        .config-card { background: white; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); max-width: 500px; }
        .month-picker { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .month-picker button { border: none; background: var(--primary); color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-salvar { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>Painel</h2>
        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="financeiro.html"><i class="fa-solid fa-wallet"></i> Financeiro</a></li>
            <li class="active"><a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a></li>
        </ul>
    </nav>

    <main class="main">
        <div class="config-card">
            <h2>Configurações de Renda</h2>
            <p>Defina sua renda para o mês selecionado:</p>
            
            <div class="month-picker">
                <button onclick="mudarMes(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="mes-label">...</h3>
                <button onclick="mudarMes(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <label>Renda Mensal (R$):</label>
            <input type="number" id="renda-input" placeholder="Ex: 5000.00">
            <button class="btn-salvar" onclick="salvarConfig()">Salvar Configuração</button>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBiHEK1MMew-1OXVpb1iUsnx249wPD6GYA",
            authDomain: "pagefinanceirokaue.firebaseapp.com",
            projectId: "pagefinanceirokaue",
            storageBucket: "pagefinanceirokaue.firebasestorage.app",
            messagingSenderId: "265354403807",
            appId: "1:265354403807:web:2953fdf433e32ee3676e6a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let dataRef = new Date();
        const nomesMeses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

        // VIGIA DE LOGIN (Isso impede de voltar para o login sozinho)
        auth.onAuthStateChanged((user) => {
            if (user) {
                carregarRenda();
            } else {
                window.location.href = "index.html";
            }
        });

        async function carregarRenda() {
            const user = auth.currentUser;
            const m = dataRef.getMonth();
            const a = dataRef.getFullYear();
            document.getElementById('mes-label').innerText = `${nomesMeses[m]} ${a}`;

            const doc = await db.collection("configuracoes").doc(`${user.uid}_${m}_${a}`).get();
            if (doc.exists) {
                document.getElementById('renda-input').value = doc.data().renda;
            } else {
                document.getElementById('renda-input').value = "";
            }
        }

        async function salvarConfig() {
            const user = auth.currentUser;
            const renda = parseFloat(document.getElementById('renda-input').value);
            const m = dataRef.getMonth();
            const a = dataRef.getFullYear();

            if (isNaN(renda)) return alert("Digite um valor válido!");

            await db.collection("configuracoes").doc(`${user.uid}_${m}_${a}`).set({
                uid: user.uid,
                renda: renda,
                mes: m,
                ano: a
            });

            alert("Renda salva com sucesso!");
        }

        function mudarMes(dir) {
            dataRef.setMonth(dataRef.getMonth() + dir);
            carregarRenda();
        }
    </script>
</body>
</html>
