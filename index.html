<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">    
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>

<body>
    
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Criar Conta</h1>
                <div class="social-icons">
                    <a href="#" class="icon btn-google"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon btn-github"><i class="fa-brands fa-github"></i></a>
                    <!-- <a href="#" class="icon btn-facebook"><i class="fa-brands fa-facebook-f"></i></a> -->
                    <a href="#" class="icon btn-linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>Ou use seu email para se registrar</span>
                <input type="text" id="reg-name" placeholder="Nome">
                <input type="email" id="reg-email" placeholder="Email">
                <input type="password" id="reg-pass" placeholder="Senha">
                <button id="btn-signup">Registrar</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form>
                <h1>Login</h1>
                <div class="social-icons">
                    <a href="#" class="icon btn-google"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon btn-github"><i class="fa-brands fa-github"></i></a>
                    <!--<a href="#" class="icon btn-facebook"><i class="fa-brands fa-facebook-f"></i></a> -->
                    <a href="#" class="icon btn-linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-pass" placeholder="Senha">
                <a href="#" id="forgot-password">Esqueceu a Senha?</a>
                <button id="btn-signin">Login</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem Vindo de Volta!</h1>
                    <p>Entre com suas credenciais para acessar sua conta.</p>
                    <button class="hidden" id ="login">Login</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Ola Amigo!</h1>
                    <p>Que tal criar uma conta para que possa usar todas as funções do site?</p>                    
                    <button class="hidden" id="register">Registrar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

</body>
</html>
